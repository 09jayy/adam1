name: Build, Test, Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  code-review:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'

      - name: Install dependencies
        run: pip install requests

      - name: AI code review
        env:
          API_KEY: ${{ secrets.CODE_REVIEW_KEY }}
          CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
        run: python scripts/code_review.py
      
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: binary
          path: target/aarch64-unknown-linux-gnu/release/${{ vars.APP_NAME }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: run tests
        run: cargo test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production 
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binary

      - name: Connect to VPN
        env:
          WG_CLIENT_IP: ${{ vars.WG_CLIENT_IP }}
          WG_ENDPOINT: ${{ vars.WG_ENDPOINT }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          sudo apt-get install -y wireguard-tools
          sudo mkdir -p /etc/wireguard
          sudo tee /etc/wireguard/wg-ci.conf >/dev/null <<EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = ${WG_CLIENT_IP}/32

          [Peer]
          PublicKey = ${{ secrets.WG_PI_PUBLIC_KEY }}
          Endpoint = ${WG_ENDPOINT}
          AllowedIPs = ${DEPLOY_HOST}/24
          PersistentKeepalive = 25
          EOF
          sudo chmod 600 /etc/wireguard/wg-ci.conf
          sudo wg-quick up wg-ci

      - name: Verify tunnel
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 15); do
            ping -c1 -W1 "$DEPLOY_HOST" >/dev/null 2>&1 || true
            if sudo wg show wg-ci latest-handshakes | awk '{print $2}' | grep -qv '^0$'; then
              echo "handshake ok"; exit 0
            fi
            sleep 1
          done
          sudo wg show
          echo "no handshake"; exit 1

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "private key OK"
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts

      - name: Copy and restart
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          scp ./$APP_NAME "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$APP_NAME"
          
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/bin/install -m 755 /tmp/$APP_NAME /opt/$APP_NAME/$APP_NAME && sudo /usr/bin/systemctl restart $APP_NAME"

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down ./wg-ci.conf || true
