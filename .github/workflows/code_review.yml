name: AI Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  code-review:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Ensure origin/main is available
        run: |
          git fetch origin main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'

      - name: Install dependencies
        run: pip install requests

      - name: AI code review
        env:
          CODE_REVIEW_KEY: ${{ secrets.CODE_REVIEW_KEY }}
          CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}

        run: python scripts/code_review.py

